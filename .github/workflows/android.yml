name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The wrapper may be checked in without the executable bit from a Windows machine.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build, unit test and lint all variants
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease lintRelease assembleDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kimi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  device-tests:
    name: Android device flows
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Firebase-backed device tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: npx -y firebase-tools@latest emulators:exec --only auth,firestore --project demo-kimi-auth "./gradlew connectedDebugAndroidTest --stacktrace"
